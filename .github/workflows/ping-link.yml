name: Notify LINK repo

on:
  push:
      branches:
       - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.actor != 'ai dan marler1'
    steps:
      - name: Trigger LINK update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LINK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aidanmarler/LINK/actions/dispatches \
            -d '{"event_type": "arc-translations-updated"}'
